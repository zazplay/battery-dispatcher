<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battery Dispatcher · Azileon</title>
    <meta name="description" content="AI battery dispatcher for solar plants: charges in the cheapest hours, sells at the day's peak price. Delivered turnkey by Azileon." />
    <!-- one address per language: the same hreflang set on every page, the canonical points at the page's own language
         (the build sets it per language page). English is the default: the root, which only redirects to the visitor's
         language, is canonicalized to /en/, and /en/ is the x-default. -->
    <link rel="canonical" href="https://battery.azileon.cz/en/" />
    <link rel="alternate" hreflang="en" href="https://battery.azileon.cz/en/" />
    <link rel="alternate" hreflang="cs" href="https://battery.azileon.cz/cs/" />
    <link rel="alternate" hreflang="pl" href="https://battery.azileon.cz/pl/" />
    <link rel="alternate" hreflang="uk" href="https://battery.azileon.cz/uk/" />
    <link rel="alternate" hreflang="x-default" href="https://battery.azileon.cz/en/" />
    <!-- link previews (LinkedIn, Telegram, WhatsApp); the build localizes these per language page -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://battery.azileon.cz/" />
    <meta property="og:title" content="Battery Dispatcher · Azileon" />
    <meta property="og:description" content="AI battery dispatcher for solar plants: charges in the cheapest hours, sells at the day's peak price. Delivered turnkey by Azileon." />
    <meta property="og:image" content="https://battery.azileon.cz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#3b6cff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
